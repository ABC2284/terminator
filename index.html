<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRUEALPHA WARFARE | Attack Terminal</title>
  <style>
    :root {
      --bg-color: #050102;
      --panel-bg: rgba(15, 3, 6, 0.85);
      --primary: #ff003c;
      --primary-glow: rgba(255, 0, 60, 0.6);
      --accent: #ffb700;
      --text-color: #ffffff;
      --text-muted: #a68a90;
      --card-bg: rgba(25, 5, 10, 0.75);
      --card-border: rgba(255, 0, 60, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image:
        radial-gradient(circle at 50% 10%, rgba(255, 0, 60, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 20% 90%, rgba(100, 0, 20, 0.3) 0%, transparent 60%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      overflow-x: hidden; padding: 15px;
    }

    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(255, 0, 60, 0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 0, 60, 0.04) 1px, transparent 1px);
      background-size: 25px 25px;
      animation: gridMove 15s linear infinite;
      z-index: -2;
    }
    body::after {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px; z-index: -1; pointer-events: none;
    }
    @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(25px); } }

    .container {
      background: var(--panel-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 0, 60, 0.15), inset 0 0 15px rgba(255, 0, 60, 0.1);
      padding: 25px 20px; border-radius: 20px;
      width: 100%; max-width: 390px; text-align: center;
      position: relative;
      transform: perspective(1000px) rotateX(2deg);
      animation: containerFloat 6s ease-in-out infinite alternate;
    }
    @keyframes containerFloat {
      0% { transform: perspective(1000px) rotateX(2deg) translateY(0); }
      100% { transform: perspective(1000px) rotateX(-2deg) translateY(-5px); }
    }

    .radar-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: scanRadar 3s ease-in-out infinite; opacity: 0.7;
    }
    @keyframes scanRadar { 0% { top: 0%; opacity: 0.2; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0.2; } }

    .logo-container {
      position: relative; width: 65px; height: 65px;
      margin: 0 auto 12px auto; background: rgba(255, 0, 60, 0.1);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      border: 1px dashed var(--primary); animation: spinLogoContainer 10s linear infinite;
    }
    @keyframes spinLogoContainer { 100% { transform: rotate(360deg); } }
    .logo { width: 70%; height: 70%; object-fit: contain; filter: drop-shadow(0 0 8px var(--primary)); }

    h1 { font-size: 20px; font-weight: 900; letter-spacing: 3px; margin-bottom: 4px; color: #fff; text-shadow: 0 0 10px var(--primary); }
    p.subtitle { color: var(--accent); font-size: 10px; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

    .input-group { position: relative; margin-bottom: 18px; }
    input[type="text"] {
      width: 100%; padding: 12px 15px;
      background: rgba(5, 1, 2, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; color: #fff; font-size: 14px; outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow), inset 0 2px 5px rgba(0,0,0,0.5); }

    .bug-selector-label { text-align: left; font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
    .bug-options-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

    .bug-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: all 0.25s ease;
    }
    .bug-card:hover { border-color: var(--primary); background: rgba(60, 10, 20, 0.8); transform: translateX(3px); }
    .bug-card.selected { border-color: var(--primary); background: rgba(255, 0, 60, 0.18); box-shadow: 0 0 12px rgba(255, 0, 60, 0.3); }

    .bug-info { text-align: left; }
    .bug-title { font-size: 12px; font-weight: bold; color: #fff; letter-spacing: 0.5px; }
    .bug-desc { font-size: 9px; color: var(--text-muted); margin-top: 2px; }

    .radio-dot { width: 14px; height: 14px; border: 2px solid var(--text-muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
    .bug-card.selected .radio-dot { border-color: var(--primary); background: var(--primary); box-shadow: 0 0 8px var(--primary); }
    .bug-card.selected .radio-dot::after { content: ""; width: 5px; height: 5px; background: #fff; border-radius: 50%; }

    button#sendBtn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary), #80001f);
      color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; font-size: 13px; font-weight: 900; cursor: pointer;
      letter-spacing: 2px; transition: all 0.3s ease; position: relative; overflow: hidden;
      box-shadow: 0 5px 20px rgba(255, 0, 60, 0.5);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    button#sendBtn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: 0.5s;
    }
    button#sendBtn:hover::before { left: 100%; }
    button#sendBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 0, 60, 0.8); background: linear-gradient(135deg, #ff1a4d, var(--primary)); }
    button#sendBtn:active { transform: translateY(1px); }
    button#sendBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 1, 2, 0.93); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease; z-index: 10;
    }
    #loading-overlay.active { opacity: 1; pointer-events: auto; }

    .cyber-loader { position: relative; width: 60px; height: 60px; margin-bottom: 15px; }
    .loader-ring {
      position: absolute; width: 100%; height: 100%;
      border: 3px solid transparent; border-top-color: var(--primary); border-bottom-color: var(--accent);
      border-radius: 50%; animation: spinLoader 1s linear infinite;
    }
    .loader-ring:nth-child(2) {
      width: 75%; height: 75%; top: 12.5%; left: 12.5%;
      border-left-color: #00ffcc; border-right-color: transparent;
      animation: spinLoaderRev 0.8s linear infinite;
    }
    @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spinLoaderRev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

    #loading-text { color: var(--primary); font-size: 11px; letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 8px var(--primary); text-align: center; padding: 0 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="radar-line"></div>

    <div id="loading-overlay">
      <div class="cyber-loader">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
      </div>
      <div id="loading-text">INATUMA SHAMBULIO...</div>
    </div>

    <h1>DANGER ZONE</h1>
    <div class="logo-container">
      <img src="logo.png" class="logo" alt="Logo"/>
    </div>
    <p class="subtitle">TACTICAL ATTACK INTERFACE</p>

    <div class="input-group">
      <input type="text" id="target" placeholder="Target Number (+255712...)">
    </div>

    <div class="bug-selector-label">CHAGUA (BUG)</div>

    <div class="bug-options-grid">
      <div class="bug-card selected" onclick="selectBug(this, 'ComboAttack')">
        <div class="bug-info">
          <div class="bug-title">Blank Freeze</div>
          <div class="bug-desc">Multi-payload heavy crash sequence</div>
        </div>
        <div class="radio-dot"></div>
      </div>

      <div class="bug-card" onclick="selectBug(this, 'vikodelay2')">
        <div class="bug-info">
          <div class="bug-title">Delay Hard</div>
          <div class="bug-desc">Album payload &amp; media bomb attack</div>
        </div>
        <div class="radio-dot"></div>
      </div>

      <div class="bug-card" onclick="selectBug(this, 'FcInvis')">
        <div class="bug-info">
          <div class="bug-title">ForClose Invisible</div>
          <div class="bug-desc">Stealth encrypted call node close</div>
        </div>
        <div class="radio-dot"></div>
      </div>
    </div>

    <input type="hidden" id="bug-type" value="ComboAttack">

    <button id="sendBtn">⚡ EXECUTE ATTACK</button>
  </div>

  <script>
    function selectBug(element, bugValue) {
      document.querySelectorAll('.bug-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      document.getElementById('bug-type').value = bugValue;
    }
  </script>

  <script src="admin.js"></script>
</body>
</html>
